<script>
(function(){
  "use strict";
  const data = BOOK_DATA;

  // ---------- PAGES ----------
  // Build an ordered list of "sections" first; actual page breaks are decided by
  // MEASURING rendered height so no page ever overflows (fixes cut-off pages).
  function words(b){
    if(b.type==='table') return 26 + b.rows.length*6;
    if(b.type==='stat')  return 18;
    if(b.type==='quote') return 14 + ((b.text||'').split(/\s+/).length);
    return (b.text||'').replace(/<[^>]+>/g,'').split(/\s+/).filter(Boolean).length;
  }

  // sections describe the book's structure independent of pagination
  const sections = [{kind:'cover'}];
  data.forEach((ch, ci)=>{
    if(ch.frontmatter && ch.blocks[0] && ch.blocks[0].type==='dedication'){
      sections.push({kind:'opener', frontmatter:true, dedication:ch.blocks[0].lines,
                     label:ch.label, heading:ch.heading});
      return;
    }
    sections.push({kind:'opener', chapter:ci, label:ch.label, heading:ch.heading,
                   tag:ch.subtitle, backmatter:!!ch.backmatter});
    sections.push({kind:'body', chapter:ci, heading:ch.heading,
                   blocks:ch.blocks, backmatter:!!ch.backmatter});
  });

  let pages = [];     // filled by buildPages()
  let N = 0;
  const SHEETS = 35;

  // A hidden measuring stage that mirrors the real leaf's geometry & styles.
  let measureLeaf=null, measureBody=null;
  function ensureMeasure(){
    if(measureLeaf) return;
    measureLeaf=document.createElement('div');
    measureLeaf.className='leaf';
    measureLeaf.style.position='absolute';
    measureLeaf.style.visibility='hidden';
    measureLeaf.style.pointerEvents='none';
    measureLeaf.style.left='-99999px';
    measureLeaf.style.top='0';
    document.getElementById('book').appendChild(measureLeaf);
  }
  // returns the usable body height in px for a real page at current size
  function pageMetrics(){
    ensureMeasure();
    const leafEl=document.getElementById('leaf');
    const rect=leafEl.getBoundingClientRect();
    measureLeaf.style.width=rect.width+'px';
    measureLeaf.style.height=rect.height+'px';
    // build a real content+runhead+body+folio skeleton to measure the body box
    measureLeaf.innerHTML=`<div class="content">
      <div class="runhead"><span class="t">The Broken Penny</span><span class="dot">•</span><span class="s">One Cent. One Hundred Million Pieces. The Future of Money.</span></div>
      <div class="body" id="__mbody"></div>
      <div class="folio"></div>
    </div>`;
    measureBody=measureLeaf.querySelector('#__mbody');
    return measureBody.clientHeight;   // available height for body content
  }

  function buildPages(){
    const avail = pageMetrics();
    pages=[];
    for(const sec of sections){
      if(sec.kind!=='body'){ pages.push(sec); continue; }
      // greedily pack blocks into pages by measured height, honoring keep groups
      let bucket=[];
      const flushBody=()=>{ if(bucket.length){ pages.push({kind:'text',chapter:sec.chapter,
        heading:sec.heading, blocks:bucket, backmatter:sec.backmatter}); bucket=[]; } };
      const fits=(blks)=>{
        measureBody.innerHTML=renderBlocks(blks);
        return measureBody.scrollHeight <= avail+1;
      };
      const blocks=sec.blocks;
      for(let i=0;i<blocks.length;i++){
        // assemble the next unit: a keep_next heading binds to the following block;
        // consecutive keep:true blocks (cheat-sheet tables) try to bind together,
        // but only while the combined unit still fits a page on its own.
        let unit=[blocks[i]];
        if(blocks[i].keep_next && blocks[i+1]){ unit.push(blocks[++i]); }
        while(blocks[i] && blocks[i].keep && blocks[i+1] && blocks[i+1].keep){
          const tryUnit=unit.concat([blocks[i+1]]);
          if(!fits(tryUnit)) break;     // would overflow even alone -> let it break here
          unit.push(blocks[++i]);
        }
        const trial=bucket.concat(unit);
        if(fits(trial) || bucket.length===0){
          bucket=trial;
        } else {
          flushBody();
          bucket=unit.slice();
        }
      }
      flushBody();
    }
    N=pages.length;
    scrub.max=N-1;
  }

  function pageMillis(p, wpm){
    // Time each page by how long its NARRATION takes — accurate for dense pages,
    // tables, and big-number stat boxes, because the spoken text expands symbols and
    // numbers into the words a voice actually says. (No sound is played in silent
    // autoplay; we just reuse the same per-page spoken text to measure duration.)
    const idx = pages.indexOf(p);
    const spoken = (idx>=0) ? pageSpeech(idx) : '';
    const spokenWords = spoken ? spoken.split(/\s+/).filter(Boolean).length : 0;
    // Speech engines read ~165 wpm at normal rate; the PACE selector scales it
    // (Slow/Average/Fast = 160/220/300 → ~0.73/1.0/1.36x of the average voice rate).
    const spokenWpm = 165 * (wpm/220);
    const readMs = (spokenWords / spokenWpm) * 60000;
    // small fixed beats: time to register a new page + a short pause at the end
    const settleMs = 900;
    return Math.max(3500, Math.round(readMs + settleMs));
  }

  // ---------- DECKLE EDGES (front ragged -> back clean) ----------
  function buildForeEdge(){
    const svg=document.getElementById('foreEdge');
    const H=600,W=44,segs=46,M=SHEETS;let html='';
    for(let i=0;i<M;i++){
      const depth=i/(M-1||1);
      const x0=(i/M)*(W-9);
      const xw=(W-9)/M+5;
      const deckle=(1-depth)*7.0+0.3;
      let seed=i*97.13;const rnd=()=>{seed=Math.sin(seed)*43758.5453;return seed-Math.floor(seed);};
      let pts=[];
      for(let s=0;s<=segs;s++){const y=(s/segs)*H;
        const jag=(rnd()-0.5)*2*deckle+(Math.sin(y*0.06+i)*deckle*0.4);
        pts.push([x0+xw+jag,y]);}
      let d=`M ${x0} 0 L ${pts[0][0].toFixed(1)} 0 `;
      pts.forEach(p=>d+=`L ${p[0].toFixed(1)} ${p[1].toFixed(1)} `);
      d+=`L ${x0} ${H} Z`;
      const lit=11+depth*15, hue=34-depth*12, sat=42-depth*34;
      const shade=(i%2===0)?1:0.85;
      html+=`<path d="${d}" fill="hsl(${hue} ${sat}% ${lit}%)" opacity="${(0.55+depth*0.4)*shade}"/>`;
    }
    svg.innerHTML=html;
  }
  function buildBottomEdge(){
    const svg=document.getElementById('bottomEdge');
    const W=600,H=32,M=SHEETS;let html='';
    for(let i=0;i<M;i++){
      const depth=i/(M-1||1);const y0=(i/M)*(H-7);const yh=(H-7)/M+4;
      const deckle=(1-depth)*4.2+0.2;
      let seed=i*53.7;const rnd=()=>{seed=Math.sin(seed)*43758.5453;return seed-Math.floor(seed);};
      let pts=[];const segs=40;
      for(let s=0;s<=segs;s++){const x=(s/segs)*W;pts.push([x,y0+yh+(rnd()-0.5)*2*deckle]);}
      let d=`M 0 ${y0} `;pts.forEach(p=>d+=`L ${p[0].toFixed(1)} ${p[1].toFixed(1)} `);d+=`L ${W} ${y0} Z`;
      const lit=10+depth*13,hue=34-depth*12,sat=40-depth*32;
      html+=`<path d="${d}" fill="hsl(${hue} ${sat}% ${lit}%)" opacity="${0.5+depth*0.4}"/>`;
    }
    svg.innerHTML=html;
  }

  // ---------- RENDER ----------
  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}

  function renderBlock(b){
    if(b.type==='h')   return b.keep_next ? `<h3 class="banner">${b.text}</h3>` : `<h3>${b.text}</h3>`;
    if(b.type==='sub') return `<div class="subline">${b.text}</div>`;
    if(b.type==='quote') return `<div class="quote"><span class="mark">&rdquo;</span>`+
        `<span class="q">${b.text}</span>`+
        (b.attrib?`<span class="attrib">— ${b.attrib}</span>`:'')+`</div>`;
    if(b.type==='fact') return `<div class="fact"><span class="label">${b.label}</span>`+
        `<span class="ftext">${b.text}</span></div>`;
    if(b.type==='stat'){
      const colorClass = /^21,000,000$/.test(b.num) || /Maximum|TOTAL SATOSHIS/i.test(b.label) ? 'gold':'orange';
      return `<div class="stat">`+
        (b.label?`<span class="label">${b.label}</span>`:'')+
        `<span class="num ${colorClass}">${b.num}</span>`+
        (b.cap?`<span class="cap">${b.cap}</span>`:'')+`</div>`;
    }
    if(b.type==='table'){
      const [head,...rows]=b.rows;
      const th=`<tr>${head.map(c=>`<th>${c}</th>`).join('')}</tr>`;
      const tr=rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('');
      return `<table class="bookt">${th}${tr}</table>`;
    }
    if(b.type==='dedication') return `<div class="dedication">`+
        (b.lines||[]).map(l=>`<div class="dline">${l}</div>`).join('')+`</div>`;
    if(b.type==='colophon') return `<div class="colophon">${b.text}</div>`;
    if(b.type==='callout') return `<div class="callout">${b.text}</div>`;
    return `<p>${b.text}</p>`;
  }

  // detect a leading equation line (e.g. "¢ ÷ 100,000,000 = ₿") to style large/centered
  function renderBlocks(blocks){
    let out='';
    blocks.forEach((b,i)=>{
      if(b.type==='p' && /[=÷₿¢]/.test(b.text.replace(/<[^>]+>/g,'')) &&
         b.text.replace(/<[^>]+>/g,'').length<40 && /[0-9]/.test(b.text)){
        out+=`<div class="equation">${b.text.replace(/<\/?strong>/g,'')}</div>`;
      } else {
        out+=renderBlock(b);
      }
    });
    return out;
  }

  function coverHTML(){
    return `<div class="content cover">
      <div class="topline"><span class="t">The Broken Penny</span><span class="s">One Cent. One Hundred Million Pieces. The Future of Money.</span></div>
      <div class="vidwrap">
        <video src="${PENNY_VIDEO}" autoplay muted loop playsinline></video>
        <div class="vfallback">&cent;</div>
      </div>
      <div class="covertitle">
        <span class="the">THE</span>
        <span class="broken"><span class="btc">&#8383;</span>ROKEN</span>
        <span class="penny">PENNY</span>
      </div>
      <div class="subs">One Cent. One Hundred Million Pieces.<br>How the Satoshi Became the Currency of the Universe.</div>
      <div class="byline">by roy m. avila</div>
      <div class="satline">&#8383;&nbsp; 1 BTC = 100,000,000 Satoshis &nbsp;&#8383;</div>
    </div>`;
  }

  function pageHTML(idx){
    const p=pages[idx];
    const modern = idx/(N-1) > 0.62;
    if(p.kind==='cover') return {modern:false, html:coverHTML()};
    if(p.kind==='opener'){
      // dedication front-matter: render the verse centered on the opener page itself
      if(p.frontmatter && p.dedication){
        return {modern:false, html:`<div class="content opener">
          <div class="marker">&#10086;</div>
          <div class="dedication">${p.dedication.map(l=>`<div class="dline">${l}</div>`).join('')}</div>
          <div class="orule"></div>
        </div>`};
      }
      const marker = p.backmatter ? '&#10086;&nbsp; Reference &nbsp;&#10087;' : `— ${esc(p.label).toUpperCase()} —`;
      return {modern, html:`<div class="content opener">
        <div class="marker">${marker}</div>
        <h2>${p.heading}</h2>
        ${p.tag?`<div class="tag">${p.tag}</div>`:''}
        <div class="orule"></div>
      </div>`};
    }
    return {modern, html:`<div class="content">
      <div class="runhead"><span class="t">The Broken Penny</span><span class="dot">•</span><span class="s">One Cent. One Hundred Million Pieces. The Future of Money.</span></div>
      <div class="body">${renderBlocks(p.blocks)}</div>
      <div class="folio"></div>
    </div>`};
  }

  // ---------- SPOKEN TEXT (for read-aloud) ----------
  function speakable(s){
    // strip HTML, normalize symbols & numbers into words the TTS reads naturally
    let t = (s||'').replace(/<[^>]+>/g,' ');
    t = t.replace(/&amp;/g,' and ').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
         .replace(/&rdquo;|&ldquo;|&quot;/g,' ').replace(/&#?\w+;/g,' ');
    t = t.replace(/₿/g,' Bitcoin ').replace(/¢/g,' cent ')
         .replace(/÷/g,' divided by ').replace(/×|x(?=\s*\d)/g,' times ')
         .replace(/≈|~/g,' about ').replace(/=/g,' equals ').replace(/•/g,', ');
    t = t.replace(/\s+/g,' ').trim();
    t = t.replace(/\s*\.\s*\.+/g,'.').replace(/\s+([.,])/g,'$1');  // collapse double periods
    return t;
  }
  function pageSpeech(idx){
    const p = pages[idx];
    if(p.kind==='cover') return 'The Broken Penny. One cent. One hundred million pieces. How the Satoshi became the currency of the universe. By Roy M. Avila.';
    if(p.kind==='opener'){
      if(p.frontmatter && p.dedication) return speakable(p.dedication.join('. '));
      const lead = p.backmatter ? 'Reference. ' : `${p.label}. `;
      return speakable(lead + p.heading + (p.tag?'. '+p.tag:''));
    }
    // body page: walk blocks in order, producing readable prose
    const parts = [];
    p.blocks.forEach(b=>{
      if(b.type==='table'){
        // read header then each row as "h1: v1, h2: v2"
        const [head,...rows] = b.rows;
        const h = head.map(speakable);
        rows.forEach(r=>{
          const cells = r.map(speakable);
          parts.push(cells.map((c,i)=> (h[i]?h[i]+': ':'')+c).join(', ') + '.');
        });
      } else if(b.type==='stat'){
        parts.push(speakable([b.label,b.num,b.cap].filter(Boolean).join('. ')) + '.');
      } else if(b.type==='quote'){
        parts.push(speakable(b.text) + (b.attrib? '. '+speakable(b.attrib):'') + '.');
      } else if(b.type==='fact'){
        parts.push(speakable(b.label) + '. ' + speakable(b.text));
      } else if(b.type==='colophon'){
        parts.push(speakable(b.text)+'.');
      } else {
        const s = speakable(b.text);
        if(s) parts.push(s);
      }
    });
    return parts.join(' ');
  }


  const flipper=document.getElementById('flipper');
  const flipFront=document.getElementById('flipFront');
  const flipBack=document.getElementById('flipBack');
  const meta=document.getElementById('meta');
  const scrub=document.getElementById('scrub');
  const progress=document.getElementById('progress');
  const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  let cur=0, animating=false;

  // ---------- PAGE-FLIP SOUND (synthesized, no external file) ----------
  let audioCtx=null, soundOn=true;
  function flipSound(){
    if(!soundOn) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      if(!audioCtx) audioCtx = new AC();
      if(audioCtx.state==='suspended') audioCtx.resume();
      const ctx=audioCtx, t0=ctx.currentTime, dur=0.34;
      // Noise burst = the paper "riffle"
      const frames=Math.floor(ctx.sampleRate*dur);
      const buf=ctx.createBuffer(1, frames, ctx.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<frames;i++){
        const p=i/frames;
        // crackly, slightly granular noise that thins out toward the end
        const grain = (Math.random()*2-1) * (1-p) ;
        d[i]= grain * (0.6 + 0.4*Math.sin(p*40));
      }
      const src=ctx.createBufferSource(); src.buffer=buf;
      // band-pass swept upward = the "whoosh" of the page arc
      const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.8;
      bp.frequency.setValueAtTime(900, t0);
      bp.frequency.exponentialRampToValueAtTime(2600, t0+dur*0.5);
      bp.frequency.exponentialRampToValueAtTime(1400, t0+dur);
      // gentle high-pass to keep it papery, not muddy
      const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=500;
      // amplitude envelope: quick swell, soft tail
      const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.16, t0+0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(ctx.destination);
      src.start(t0); src.stop(t0+dur);
    }catch(e){/* audio not available; ignore */}
  }

  function wrap(inner){ return `<div class="gutter"></div>${inner}<div class="vignette"></div>`; }

  function paint(idx){
    const {html,modern}=pageHTML(idx);
    leaf.className='leaf'+(modern?' modern':'');
    leaf.innerHTML=wrap(html);
    // (re)start cover video if present
    const v=leaf.querySelector('video');
    if(v){ v.play().catch(()=>{ const f=leaf.querySelector('.vfallback'); if(f) f.style.display='flex'; }); }
    meta.textContent=`${idx+1} / ${N}`;
    scrub.value=idx;
    progress.style.width=((idx+1)/N*100)+'%';
    document.getElementById('first').disabled=idx===0;
    document.getElementById('prev').disabled=idx===0;
    document.getElementById('next').disabled=idx===N-1;
    document.getElementById('last').disabled=idx===N-1;
  }

  function settle(){
    // called whenever a page becomes the stable current page
    if(reading) speakCurrent();
  }
  let activeFinish=null;     // the finishFlip of the flip currently animating (if any)
  function cancelFlip(){
    // abort an in-progress flip without leaving stale state: hide flipper, clear flag
    if(activeFinish){ activeFinish(true); activeFinish=null; }
  }

  function go(target){
    target=Math.max(0,Math.min(N-1,target));
    if(target===cur && !animating) return;
    // if a flip is mid-air, finish it instantly so we start from a clean, correct state
    if(animating) cancelFlip();
    if(target===cur) return;
    if(reduced){ cur=target; paint(cur); settle(); schedule(); return; }
    animating=true;
    const forward=target>cur;
    const from=cur;
    const curHTML=pageHTML(from).html;
    const tgtHTML=pageHTML(target).html;
    // 1) Build the flipper faces and show it FLAT, covering the current page, with NO
    //    transition yet. The underlying leaf is still the current page at this instant.
    flipFront.innerHTML=wrap(forward?curHTML:tgtHTML);
    flipBack.innerHTML=wrap(forward?tgtHTML:curHTML);
    flipper.style.display='block';
    flipper.style.transition='none';
    flipper.style.transform=forward?'rotateY(0deg)':'rotateY(-180deg)';
    // 2) Force the browser to commit that flat-flipper frame BEFORE anything else, so the
    //    flipper is on screen covering the page (no gap where the next page peeks through).
    void flipper.offsetWidth;
    // 3) Now repaint the underlying leaf to the TARGET page — it's hidden behind the
    //    flipper, so the swap is invisible.
    paint(target);
    // 4) Next frame, start the rotation; the flip reveals the (already-correct) target.
    let done=false, fallbackT=null;
    const finishFlip=(silent)=>{
      if(done) return; done=true;
      flipper.removeEventListener('transitionend', onEnd);
      clearTimeout(fallbackT);
      flipper.style.display='none';
      flipper.style.transition='none';
      animating=false; cur=target; activeFinish=null;
      if(!silent){ schedule(); settle(); }   // silent=true when aborted by a new nav
    };
    activeFinish=finishFlip;
    const onEnd=(e)=>{ if(e.target===flipper && e.propertyName==='transform') finishFlip(false); };
    flipper.addEventListener('transitionend', onEnd);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      flipper.style.transition='transform .72s cubic-bezier(.4,.05,.3,1)';
      flipper.style.transform=forward?'rotateY(-180deg)':'rotateY(0deg)';
      flipSound();
    }));
    // fallback in case transitionend doesn't fire (tab backgrounded, etc.)
    fallbackT=setTimeout(()=>finishFlip(false), 900);
  }

  // ---------- AUTOPLAY ----------
  let playing=true, timer=null;
  const playBtn=document.getElementById('play');
  const speedSel=document.getElementById('speed');
  function schedule(){
    clearTimeout(timer);
    if(!playing) return;
    if(cur>=N-1){ setPlaying(false); return; }
    const wpm=parseInt(speedSel.value,10);
    timer=setTimeout(()=>{ go(cur+1); }, pageMillis(pages[cur],wpm));
  }
  function setPlaying(v){
    playing=v;
    if(v && reading) setReading(false);   // silent autoplay and narration are mutually exclusive
    playBtn.innerHTML=v?'&#10073;&#10073;':'&#9658;';
    playBtn.title=v?'Pause':'Play';
    const hint=document.getElementById('hint');
    if(v){ hint.textContent='Pages turn automatically at reading pace — tap pause to read freely.'; schedule(); }
    else { clearTimeout(timer); hint.textContent='Paused — read at your own pace. Tap play to resume, or use the arrows / slider.'; }
  }

  // ---------- READ ALOUD (Web Speech API) ----------
  const synth = window.speechSynthesis;
  const readBtn = document.getElementById('readBtn');
  const voiceSel = document.getElementById('voiceSel');
  const voiceWrap = document.getElementById('voiceWrap');
  let reading = false;          // narration mode active
  let voices = [];
  let chosenVoice = null;
  const ttsSupported = !!synth && 'SpeechSynthesisUtterance' in window;

  function isFemale(v){
    return /female|woman|samantha|victoria|karen|moira|tessa|fiona|serena|zira|hazel|susan|allison|ava|joanna|amy|emma|sonia|libby/i.test(v.name);
  }
  function populateVoices(){
    voices = (synth.getVoices()||[]).filter(v=>/^en(-|_|$)/i.test(v.lang));
    if(!voices.length) voices = synth.getVoices()||[];
    voiceSel.innerHTML='';
    voices.forEach((v,i)=>{
      const o=document.createElement('option');
      o.value=i; o.textContent=`${v.name.replace(/Microsoft |Google /,'')} (${v.lang})${isFemale(v)?' ♀':''}`;
      voiceSel.appendChild(o);
    });
    // default: first English female voice, else first English voice
    let def = voices.findIndex(isFemale);
    if(def<0) def=0;
    voiceSel.value=def;
    chosenVoice = voices[def]||null;
  }
  if(ttsSupported){
    populateVoices();
    if(synth.onvoiceschanged!==undefined) synth.onvoiceschanged=populateVoices;
    voiceSel.onchange=()=>{ chosenVoice=voices[+voiceSel.value]||null;
      if(reading){ synth.cancel(); speakCurrent(); } };
  } else {
    readBtn.disabled=true; readBtn.title='Read-aloud needs a browser with speech support';
    voiceWrap.classList.add('disabled');
  }

  // map PACE select to a speech rate (slow≈0.85, average≈1.0, fast≈1.2)
  function speechRate(){
    const wpm=parseInt(speedSel.value,10);
    return Math.max(0.7, Math.min(1.4, wpm/220));
  }

  let utter=null, keepAlive=null;
  function speakCurrent(){
    if(!reading) return;
    synth.cancel();
    clearInterval(keepAlive);
    const text = pageSpeech(cur);
    if(!text){ advanceAfterSpeech(); return; }
    utter = new SpeechSynthesisUtterance(text);
    if(chosenVoice) utter.voice=chosenVoice;
    utter.lang = chosenVoice ? chosenVoice.lang : 'en-US';
    utter.rate = speechRate();
    utter.onend = ()=>{ clearInterval(keepAlive); if(reading) advanceAfterSpeech(); };
    utter.onerror = ()=>{ clearInterval(keepAlive); };
    synth.speak(utter);
    // Chromium stops long utterances (~15s) unless periodically nudged
    keepAlive = setInterval(()=>{ if(synth.speaking){ synth.pause(); synth.resume(); } }, 9000);
  }
  function advanceAfterSpeech(){
    if(cur>=N-1){ setReading(false); return; }   // finished the book
    go(cur+1);                                    // turn the page; paint() re-speaks
  }
  function setReading(on){
    if(!ttsSupported) return;
    reading=on;
    readBtn.setAttribute('aria-pressed', on?'true':'false');
    readBtn.innerHTML = on ? '<span class="ri">&#10073;&#10073;</span> Stop reading'
                           : '<span class="ri">&#9835;</span> Read aloud';
    const hint=document.getElementById('hint');
    if(on){
      clearTimeout(timer); playing=false;          // narration drives advance, not the silent timer
      playBtn.innerHTML='&#9658;'; playBtn.title='Play';
      hint.textContent='Reading aloud — pages turn as each one finishes. Tap “Stop reading” to pause.';
      // some browsers require a user gesture; this call IS from the click handler
      speakCurrent();
    } else {
      synth.cancel();
      clearInterval(keepAlive);
      hint.textContent='Read-aloud stopped. Use the controls to navigate, or tap “Read aloud” to resume.';
    }
  }
  readBtn.onclick=()=>setReading(!reading);

  // ---------- EVENTS ----------
  playBtn.onclick=()=>setPlaying(!playing);
  (function(){
    const sb=document.getElementById('soundBtn'), si=document.getElementById('soundIcon');
    if(sb){ sb.onclick=()=>{ soundOn=!soundOn; sb.setAttribute('aria-pressed', soundOn?'true':'false');
      si.innerHTML = soundOn ? '&#128266;' : '&#128263;';
      if(soundOn) flipSound(); }; }   // brief preview when turning it on
  })();
  document.getElementById('next').onclick=()=>{ if(playing) setPlaying(false); go(cur+1); };
  document.getElementById('prev').onclick=()=>{ if(playing) setPlaying(false); go(cur-1); };
  document.getElementById('first').onclick=()=>{ if(playing) setPlaying(false); go(0); };
  document.getElementById('last').onclick=()=>{ setPlaying(false); go(N-1); };
  scrub.oninput=(e)=>{ if(playing) setPlaying(false); clearTimeout(timer); if(animating) cancelFlip(); cur=+e.target.value; paint(cur); };
  scrub.onchange=()=>{};
  speedSel.onchange=()=>{ if(playing)schedule(); if(reading){ synth.cancel(); speakCurrent(); } };
  document.addEventListener('keydown',(e)=>{
    if(e.key==='ArrowRight'){ if(playing) setPlaying(false); go(cur+1); }
    else if(e.key==='ArrowLeft'){ if(playing) setPlaying(false); go(cur-1); }
    else if(e.key===' '){ e.preventDefault(); setPlaying(!playing); }
  });
  leaf.addEventListener('click',(e)=>{
    if(e.target.closest('video')) return;
    if(playing) setPlaying(false);
    const r=leaf.getBoundingClientRect();
    if((e.clientX-r.left)/r.width>0.5) go(cur+1); else go(cur-1);
  });

  // ---------- INIT ----------
  function relayout(preserveIdx){
    const ratio = N>1 ? cur/(N-1) : 0;
    buildPages();
    // keep the reader roughly where they were after a re-paginate
    cur = (typeof preserveIdx==='number') ? Math.min(preserveIdx,N-1)
                                          : Math.round(ratio*(N-1));
    cur = Math.max(0, Math.min(N-1, cur));
    paint(cur);
  }
  buildForeEdge(); buildBottomEdge();
  buildPages();
  paint(0);
  setPlaying(false);

  // re-measure once web fonts have loaded (fallback metrics differ from final)
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(()=>{ relayout(cur); });
  }

  let resizeT=null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeT);
    resizeT=setTimeout(()=>{
      const wasReading=reading; if(wasReading) setReading(false);
      relayout();
      if(wasReading) setReading(true);
    }, 250);
  });
})();

</script>
</body>
</html>
